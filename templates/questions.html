<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Questions - LLM Benchmark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        .papyrus-bg { 
            background: 
                repeating-linear-gradient(
                    90deg,
                    #c9a961 0px,
                    #d4b896 2px,
                    #b8976a 4px,
                    #c9a961 6px
                ),
                linear-gradient(
                    180deg,
                    #d4b896 0%,
                    #c9a961 25%,
                    #b8976a 50%,
                    #c9a961 75%,
                    #d4b896 100%
                );
            background-image: 
                url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='woodgrain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.02 0.8' numOctaves='8' seed='2'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%' height='100%' filter='url(%23woodgrain)' opacity='0.2'/%3E%3C/svg%3E"),
                repeating-linear-gradient(
                    90deg,
                    rgba(201, 169, 97, 0.3) 0px,
                    rgba(212, 184, 150, 0.3) 1px,
                    rgba(184, 151, 106, 0.3) 2px,
                    rgba(201, 169, 97, 0.3) 3px
                ),
                linear-gradient(
                    180deg,
                    #d4b896 0%,
                    #c9a961 25%,
                    #b8976a 50%,
                    #c9a961 75%,
                    #d4b896 100%
                );
        }
        .scroll-container {
            position: relative;
            background: linear-gradient(180deg, #fdf8ed 0%, #f5ead7 50%, #f0e5d3 100%);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%' height='100%' filter='url(%23noise)' opacity='0.15'/%3E%3C/svg%3E"),
                            linear-gradient(180deg, #fdf8ed 0%, #f5ead7 50%, #f0e5d3 100%);
            border: none;
            box-shadow: 0 4px 12px rgba(139,115,85,0.12), inset 0 1px 2px rgba(255,255,255,0.5);
        }
        .scroll-roll-left, .scroll-roll-right {
            position: absolute; top: 0; bottom: 0; width: 20px;
            background: radial-gradient(ellipse at center, #a0522d 0%, #654321 100%);
            border: 2px solid #4a3520; z-index: 10;
        }
        .scroll-roll-left { left: -20px; border-radius: 10px 0 0 10px; }
        .scroll-roll-right { right: -20px; border-radius: 0 10px 10px 0; }
        .scroll-title {
            background: url('/static/scroll_bg.jpg') center/120% no-repeat;
            background-position: center;
            position: relative;
        }
        .scroll-header::before, .scroll-header::after {
            content: '⚜'; position: absolute; top: 50%; transform: translateY(-50%);
            font-size: 1.5rem; color: #d4a574;
        }
        .scroll-header::before { left: 15px; }
        .scroll-header::after { right: 15px; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .font-crimson { font-family: 'Crimson Text', serif; }
        .parchment-btn {
            background: linear-gradient(180deg, #c4956a 0%, #a67c52 100%);
            border: 2px solid #654321;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 2px 5px rgba(0,0,0,0.2);
        }
        .parchment-btn:hover { background: linear-gradient(180deg, #d4a574 0%, #b8896a 100%); }
        .wax-seal {
            display: inline-block; width: 24px; height: 24px;
            background-image: url('/static/seal.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            margin-right: 8px;
        }
        .parchment-textarea {
            background: rgba(255, 250, 240, 0.9);
            border: 1px solid rgba(139, 115, 85, 0.2);
            box-shadow: inset 0 1px 3px rgba(139,115,85,0.08);
        }
    </style>
</head>
<body class="papyrus-bg text-amber-900 font-crimson leading-relaxed min-h-screen py-8">
    <div class="max-w-3xl mx-auto px-8">
        <header class="scroll-title text-amber-900 p-6 mb-8 shadow-lg">
            <h1 class="text-3xl font-cinzel font-bold text-center">📝 Edit Questions</h1>
        </header>

        <nav class="flex gap-3 mb-8 justify-center">
            <a href="{{ url_for('index') }}" class="parchment-btn px-5 py-2.5 text-amber-50 font-cinzel text-sm">← Back to Dashboard</a>
        </nav>

        <div class="scroll-container p-6 mb-12 mx-4 relative">
            <div class="scroll-roll-left"></div>
            <div class="scroll-roll-right"></div>
            <p class="font-crimson text-amber-700"><strong class="font-cinzel">💡 Tip:</strong> <em>Enter one question per line. These questions will be sent to each selected LLM during the benchmark.</em></p>
        </div>

        <div class="scroll-container p-6 mb-12 mx-4 relative">
            <div class="scroll-roll-left"></div>
            <div class="scroll-roll-right"></div>
            <h2 class="text-xl font-cinzel font-semibold text-amber-900 mb-4 flex items-center"><span class="wax-seal"></span> Your Questions</h2>
            <form method="POST">
                <textarea name="questions" placeholder="Enter one question per line..." 
                          class="parchment-textarea w-full h-96 p-4 text-base font-crimson leading-relaxed resize-y focus:outline-none focus:ring-2 focus:ring-amber-500 text-amber-800">{% for q in questions %}{{ q }}
{% endfor %}</textarea>
                <button type="submit" class="parchment-btn mt-4 px-6 py-3 text-amber-50 font-cinzel">Save Questions</button>
            </form>
        </div>
    </div>
</body>
</html>
