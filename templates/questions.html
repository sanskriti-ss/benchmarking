<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Questions - LLM Benchmark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        .papyrus-bg { background: linear-gradient(135deg, #f5e6d3 0%, #e8d4b8 50%, #f0e0c8 100%); }
        .parchment { background: linear-gradient(180deg, #fdf6e3 0%, #f5e6d3 50%, #ede0c8 100%); box-shadow: inset 0 0 50px rgba(139,119,101,0.2), 0 4px 15px rgba(0,0,0,0.1); }
        .scroll-header { background: linear-gradient(135deg, #8b4513 0%, #654321 50%, #8b4513 100%); }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .font-crimson { font-family: 'Crimson Text', serif; }
    </style>
</head>
<body class="papyrus-bg text-amber-900 font-crimson leading-relaxed min-h-screen">
    <div class="max-w-3xl mx-auto p-5">
        <header class="scroll-header text-amber-50 p-6 mb-6 rounded-lg shadow-lg border-2 border-amber-800">
            <h1 class="text-3xl font-cinzel font-bold">📝 Edit Questions</h1>
        </header>

        <nav class="flex gap-3 mb-6">
            <a href="{{ url_for('index') }}" class="px-5 py-2.5 bg-amber-800 text-amber-50 rounded border-2 border-amber-900 hover:bg-amber-700 transition font-cinzel text-sm shadow">← Back to Dashboard</a>
        </nav>

        <div class="parchment border-l-4 border-amber-600 p-4 mb-6 rounded-r-lg">
            <strong class="font-cinzel">💡 Tip:</strong> <span class="font-crimson italic text-amber-700">Enter one question per line. These questions will be sent to each selected LLM during the benchmark.</span>
        </div>

        <div class="parchment rounded-lg p-6 mb-6 border-2 border-amber-300">
            <h2 class="text-xl font-cinzel font-semibold text-amber-900 mb-4">📜 Your Questions</h2>
            <form method="POST">
                <textarea name="questions" placeholder="Enter one question per line..." 
                          class="w-full h-96 p-4 bg-amber-50 border-2 border-amber-300 rounded text-base font-crimson leading-relaxed resize-y focus:outline-none focus:ring-2 focus:ring-amber-500 text-amber-800">{% for q in questions %}{{ q }}
{% endfor %}</textarea>
                <button type="submit" class="mt-4 px-6 py-3 bg-amber-800 text-amber-50 rounded border-2 border-amber-900 hover:bg-amber-700 transition font-cinzel shadow">Save Questions</button>
            </form>
        </div>
    </div>
</body>
</html>
